{% extends 'base.html' %}

{% block title %}
  {% if object %}Edit{% else %}Add{% endif %} Note — Sticky Notes
{% endblock title %}

{% block content %}
  <h2>{% if object %}Edit{% else %}Add{% endif %} Note</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
  </form>
  <a class="back-link" href="{% url 'notes:list' %}">← Back to all notes</a>
{% endblock content %}
