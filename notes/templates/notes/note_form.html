<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>{% if object %}Edit{% else %}Add{% endif %} Note</title>
  </head>
  <body>
    <h1>{% if object %}Edit{% else %}Add{% endif %} Note</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Save</button>
    </form>
    <p><a href="{% url 'notes:list' %}">Back</a></p>
  </body>
</html>
