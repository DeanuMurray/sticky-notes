<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Delete Note</title>
  </head>
  <body>
    <h1>Delete Note</h1>
    <p>Are you sure you want to delete "{{ object }}"?</p>
    <form method="post">{% csrf_token %}
      <button type="submit">Confirm</button>
    </form>
    <p><a href="{% url 'notes:list' %}">Cancel</a></p>
  </body>
</html>
