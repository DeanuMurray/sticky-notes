<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" font-family="Arial, sans-serif">
  <!-- Title -->
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold">Sticky Notes App – Class Diagram</text>

  <!-- ─── Note model ─── -->
  <rect x="220" y="50" width="200" height="160" fill="#fff9c4" stroke="#c8a000" stroke-width="1.5" rx="4"/>
  <!-- Class name section -->
  <rect x="220" y="50" width="200" height="30" fill="#ffe082" stroke="#c8a000" stroke-width="1.5" rx="4"/>
  <text x="320" y="70" text-anchor="middle" font-size="13" font-weight="bold">Note</text>
  <!-- Divider -->
  <line x1="220" y1="80" x2="420" y2="80" stroke="#c8a000" stroke-width="1"/>
  <!-- Attributes -->
  <text x="230" y="100" font-size="11">+ id: AutoField</text>
  <text x="230" y="116" font-size="11">+ title: CharField(200)</text>
  <text x="230" y="132" font-size="11">+ content: TextField</text>
  <text x="230" y="148" font-size="11">+ created_at: DateTimeField</text>
  <!-- Methods divider -->
  <line x1="220" y1="158" x2="420" y2="158" stroke="#c8a000" stroke-width="1"/>
  <!-- Methods -->
  <text x="230" y="174" font-size="11">+ __str__(): str</text>
  <text x="230" y="190" font-size="11">+ save(): None</text>

  <!-- ─── NoteListView ─── -->
  <rect x="30" y="280" width="160" height="80" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5" rx="4"/>
  <rect x="30" y="280" width="160" height="28" fill="#a5d6a7" stroke="#388e3c" stroke-width="1.5" rx="4"/>
  <text x="110" y="298" text-anchor="middle" font-size="12" font-weight="bold">NoteListView</text>
  <line x1="30" y1="308" x2="190" y2="308" stroke="#388e3c" stroke-width="1"/>
  <text x="40" y="326" font-size="10">model = Note</text>
  <text x="40" y="342" font-size="10">template: note_list.html</text>

  <!-- ─── NoteCreateView ─── -->
  <rect x="220" y="280" width="160" height="96" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5" rx="4"/>
  <rect x="220" y="280" width="160" height="28" fill="#a5d6a7" stroke="#388e3c" stroke-width="1.5" rx="4"/>
  <text x="300" y="298" text-anchor="middle" font-size="12" font-weight="bold">NoteCreateView</text>
  <line x1="220" y1="308" x2="380" y2="308" stroke="#388e3c" stroke-width="1"/>
  <text x="230" y="326" font-size="10">model = Note</text>
  <text x="230" y="342" font-size="10">fields: [title, content]</text>
  <text x="230" y="358" font-size="10">template: note_form.html</text>

  <!-- ─── NoteUpdateView ─── -->
  <rect x="410" y="280" width="160" height="96" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5" rx="4"/>
  <rect x="410" y="280" width="160" height="28" fill="#a5d6a7" stroke="#388e3c" stroke-width="1.5" rx="4"/>
  <text x="490" y="298" text-anchor="middle" font-size="12" font-weight="bold">NoteUpdateView</text>
  <line x1="410" y1="308" x2="570" y2="308" stroke="#388e3c" stroke-width="1"/>
  <text x="420" y="326" font-size="10">model = Note</text>
  <text x="420" y="342" font-size="10">fields: [title, content]</text>
  <text x="420" y="358" font-size="10">template: note_form.html</text>

  <!-- ─── NoteDeleteView ─── -->
  <rect x="30" y="420" width="160" height="64" fill="#fce4ec" stroke="#c62828" stroke-width="1.5" rx="4"/>
  <rect x="30" y="420" width="160" height="28" fill="#ef9a9a" stroke="#c62828" stroke-width="1.5" rx="4"/>
  <text x="110" y="438" text-anchor="middle" font-size="12" font-weight="bold">NoteDeleteView</text>
  <line x1="30" y1="448" x2="190" y2="448" stroke="#c62828" stroke-width="1"/>
  <text x="40" y="466" font-size="10">model = Note</text>

  <!-- ─── Dependency arrows (views → Note) ─── -->
  <!-- NoteListView → Note -->
  <line x1="110" y1="280" x2="270" y2="210" stroke="#555" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <!-- NoteCreateView → Note -->
  <line x1="300" y1="280" x2="320" y2="210" stroke="#555" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <!-- NoteUpdateView → Note -->
  <line x1="490" y1="280" x2="370" y2="210" stroke="#555" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <!-- NoteDeleteView → Note -->
  <line x1="110" y1="420" x2="270" y2="210" stroke="#555" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
  </defs>
</svg>
