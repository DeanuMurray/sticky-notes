<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600" width="700" height="600" font-family="Arial, sans-serif">
  <!-- Title -->
  <text x="350" y="28" text-anchor="middle" font-size="16" font-weight="bold">Sticky Notes App – Sequence Diagram (Add Note)</text>

  <!-- ─── Lifeline headers ─── -->
  <!-- User -->
  <rect x="30" y="50" width="90" height="36" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="75" y="73" text-anchor="middle" font-size="12" font-weight="bold">User</text>

  <!-- Browser -->
  <rect x="185" y="50" width="90" height="36" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="230" y="73" text-anchor="middle" font-size="12" font-weight="bold">Browser</text>

  <!-- NoteCreateView -->
  <rect x="340" y="50" width="120" height="36" rx="4" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="400" y="73" text-anchor="middle" font-size="12" font-weight="bold">NoteCreateView</text>

  <!-- Note model -->
  <rect x="530" y="50" width="120" height="36" rx="4" fill="#ffe0b2" stroke="#e65100" stroke-width="1.5"/>
  <text x="590" y="73" text-anchor="middle" font-size="12" font-weight="bold">Note (model)</text>

  <!-- ─── Lifeline dashed lines ─── -->
  <line x1="75"  y1="86" x2="75"  y2="580" stroke="#666" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="230" y1="86" x2="230" y2="580" stroke="#666" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="400" y1="86" x2="400" y2="580" stroke="#666" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="590" y1="86" x2="590" y2="580" stroke="#666" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ─── Step 1: User navigates to /add/ ─── -->
  <line x1="75" y1="130" x2="225" y2="130" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="148" y="124" text-anchor="middle" font-size="10" fill="#1565c0">GET /add/</text>

  <!-- ─── Step 2: Browser → NoteCreateView ─── -->
  <line x1="230" y1="160" x2="395" y2="160" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="312" y="154" text-anchor="middle" font-size="10" fill="#1565c0">dispatch(request)</text>

  <!-- ─── Step 3: NoteCreateView returns form ─── -->
  <line x1="395" y1="195" x2="235" y2="195" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowGray)"/>
  <text x="312" y="189" text-anchor="middle" font-size="10" fill="#555">200 OK + blank form</text>

  <!-- ─── Step 4: Browser renders form page ─── -->
  <line x1="225" y1="230" x2="80" y2="230" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowGray)"/>
  <text x="148" y="224" text-anchor="middle" font-size="10" fill="#555">render note_form.html</text>

  <!-- ─── Step 5: User fills in form and submits ─── -->
  <line x1="75" y1="275" x2="225" y2="275" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="148" y="269" text-anchor="middle" font-size="10" fill="#1565c0">POST /add/ {title, content}</text>

  <!-- ─── Step 6: Browser → NoteCreateView POST ─── -->
  <line x1="230" y1="310" x2="395" y2="310" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="312" y="304" text-anchor="middle" font-size="10" fill="#1565c0">form_valid(form)</text>

  <!-- ─── Step 7: NoteCreateView validates & creates Note ─── -->
  <line x1="400" y1="350" x2="585" y2="350" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="492" y="344" text-anchor="middle" font-size="10" fill="#2e7d32">Note.objects.create(...)</text>

  <!-- ─── Step 8: Note model insert to DB ─── -->
  <line x1="590" y1="380" x2="590" y2="400" stroke="#e65100" stroke-width="1.5"/>
  <text x="615" y="393" font-size="10" fill="#e65100">INSERT</text>
  <line x1="585" y1="415" x2="405" y2="415" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowGray)"/>
  <text x="492" y="409" text-anchor="middle" font-size="10" fill="#555">note instance</text>

  <!-- ─── Step 9: Redirect to list ─── -->
  <line x1="395" y1="455" x2="235" y2="455" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowGray)"/>
  <text x="312" y="449" text-anchor="middle" font-size="10" fill="#555">302 Redirect → /</text>

  <!-- ─── Step 10: Browser loads list page ─── -->
  <line x1="225" y1="490" x2="80" y2="490" stroke="#555" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowGray)"/>
  <text x="148" y="484" text-anchor="middle" font-size="10" fill="#555">render note_list.html</text>

  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1565c0"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2e7d32"/>
    </marker>
  </defs>
</svg>
